services:
  # Бэкенд на FastAPI
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    restart: always
    depends_on:
      db:
        condition: service_healthy  # Заставит backend ждать полной готовности СУБД
      redis:
        condition: service_started

  # База данных PostgreSQL
  db:
    image: postgres:15-alpine
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    # Оптимизация параметров памяти и подключений для PostgreSQL
    command: postgres -c max_connections=100 -c shared_buffers=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    
  # Кэш-сервер Redis
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
